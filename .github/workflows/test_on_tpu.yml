name: test DLC-Kernel-Driver on tpu [replica dry-run]
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: 44a09c8778ba2899310781ccb227ad9c82b3d2d7
  REPLICA_TEST_MODE: dry-run
jobs:
  pre-checks:
    name: pre-checks [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-driver
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: test_on_tpu.yml
      REPLICA_SOURCE_JOB: pre-checks
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  call-singlecard:
    name: call-singlecard [simulated]
    needs:
    - pre-checks
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-driver
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: test_on_tpu.yml
      REPLICA_SOURCE_JOB: call-singlecard
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
