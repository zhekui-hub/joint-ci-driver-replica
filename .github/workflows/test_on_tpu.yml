name: test DLC-Kernel-Driver on tpu [replica dry-run]
'on':
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  pre-checks:
    name: pre-checks [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: test_on_tpu.yml
      REPLICA_SOURCE_JOB: pre-checks
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
  call-singlecard:
    name: call-singlecard [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: test_on_tpu.yml
      REPLICA_SOURCE_JOB: call-singlecard
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
    needs:
    - pre-checks
