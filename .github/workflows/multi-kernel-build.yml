name: Multi-Kernel Build DLC-Kernel-Driver [replica dry-run]
'on':
  workflow_dispatch:
    inputs:
      concurrency_suffix:
        required: false
        default: ''
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  call-arsenal-multi-kernel:
    name: call-arsenal-multi-kernel [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: multi-kernel-build.yml
      REPLICA_SOURCE_JOB: call-arsenal-multi-kernel
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
