name: Release [replica dry-run]
'on':
  workflow_dispatch:
    inputs:
      version:
        description: The version to release (e.g., v0.1.11). Required for manual patch
          releases.
        required: false
        type: string
      ref:
        description: The branch or ref (full git sha) to release from.
        required: true
        type: string
        default: master
      dry_run:
        description: Run a dry-run of the release process; no branches or GitHub releases
          will be created.
        required: true
        type: boolean
        default: true
      create_nightly_release:
        description: Auto apply the nightly release tag, input version is ignored.
        required: false
        type: boolean
        default: false
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  release:
    name: release [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: release.yml
      REPLICA_SOURCE_JOB: release
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
