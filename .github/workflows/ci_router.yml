name: Driver PR CI Router [replica dry-run]
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  route:
    name: route [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: route
      REPLICA_SCOPE: public
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: python
      run: python3 ci_sim/runner.py
  prechecks:
    name: prechecks [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: prechecks
      REPLICA_SCOPE: public
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: python
      run: python3 ci_sim/runner.py
  run_actual_tpu:
    name: run_actual_tpu [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: run_actual_tpu
      REPLICA_SCOPE: public
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: python
      run: python3 ci_sim/runner.py
    needs:
    - route
    - prechecks
  run_pseudo:
    name: run_pseudo [simulated]
    if: ${{ always() }}
