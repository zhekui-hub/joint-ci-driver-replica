name: Driver PR CI Router [replica dry-run]
'on':
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail the participant aggregate simulation
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  aggregate:
    name: Driver CI aggregate
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: [self-hosted, grok-box]
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: aggregate
      REPLICA_SCOPE: participant-aggregate
      REPLICA_EXECUTION_OWNER: participant
      REPLICA_ALLOW_SKIPPED_NEEDS: 'true'
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - name: Checkout replica harness
        uses: actions/checkout@v4
      - name: Simulate participant aggregate contract
        shell: bash
        run: python3 ci_sim/runner.py
