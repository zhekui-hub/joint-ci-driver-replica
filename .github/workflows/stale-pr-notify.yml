name: Stale PR Check and Notify [replica dry-run]
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: 44a09c8778ba2899310781ccb227ad9c82b3d2d7
  REPLICA_TEST_MODE: dry-run
jobs:
  stale:
    name: stale [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-driver
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: stale-pr-notify.yml
      REPLICA_SOURCE_JOB: stale
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  notify:
    name: notify [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-driver
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: stale-pr-notify.yml
      REPLICA_SOURCE_JOB: notify
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
