name: build DLC-Kernel-Driver on pseudo dlc [replica dry-run]
'on':
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: aa84e677db3e14cd9b704534e421e0290dee7b99
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  check-branch-commit-message:
    name: check-branch-commit-message [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: build_Pseudo_DLC.yml
      REPLICA_SOURCE_JOB: check-branch-commit-message
      REPLICA_SCOPE: public
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
  call-arsenal-pseudo-test:
    name: call-arsenal-pseudo-test [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    env:
      REPLICA_REPOSITORY: driver
      REPLICA_SOURCE_WORKFLOW: build_Pseudo_DLC.yml
      REPLICA_SOURCE_JOB: call-arsenal-pseudo-test
      REPLICA_SCOPE: public
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
    needs:
    - check-branch-commit-message
