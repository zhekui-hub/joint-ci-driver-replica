name: Release

on:
  schedule:
    - cron: '0 9 * * 6'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v0.1.11). Required for manual patch releases.'
        required: false # Not required for scheduled runs
        type: string
      ref:
        description: 'The branch or ref (full git sha) to release from.'
        required: true
        type: string
        default: 'master'
      dry_run:
        description: 'Run a dry-run of the release process; no branches or GitHub releases will be created.'
        required: true
        type: boolean
        default: true
      create_nightly_release:
        description: 'Auto apply the nightly release tag, input version is ignored.'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: [self-hosted, tpu]
    environment:
      name: production-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.RELEASE_TAG }}
    if: github.repository == 'ChipLTech/DLC-Kernel-Driver'
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write # For creating issues on failure
    outputs:
      RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set booleans for simplified logic
        id: vars
        run: |
          is_dry_run="false"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            is_dry_run="true"
          fi
          echo "is_dry_run=${is_dry_run}" >> $GITHUB_OUTPUT

      - name: Get the version
        id: version
        shell: bash
        run: |
          if [[ -n "${MANUAL_VERSION}" ]]; then
            VERSION_STRING="${MANUAL_VERSION#v}"
          else
            VERSION_STRING=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi

          if [[ -z "$VERSION_STRING" ]]; then
            echo "::error::Failed to determine release version"
            exit 1
          fi

          echo "RELEASE_TAG=v$VERSION_STRING" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TITLE=Release v$VERSION_STRING" >> "$GITHUB_OUTPUT"
        env:
          MANUAL_VERSION: ${{ inputs.version }}

      - name: Check if tag already exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse ${{ steps.version.outputs.RELEASE_TAG }} >/dev/null 2>&1;
          then
            echo "Tag ${{ steps.version.outputs.RELEASE_TAG }} already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ steps.version.outputs.RELEASE_TAG }} does not exist. Proceeding with release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Install gh CLI if not exists
        if: steps.check_tag.outputs.should_release == 'true'
        run: |
          if ! command -v gh &> /dev/null
          then
              echo "gh could not be found, installing it..."
              sudo apt-get update
              sudo apt-get install -y gh
          else
              echo "gh is already installed."
          fi

      - name: Configure Git User
        if: steps.check_tag.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to a release branch
        if: steps.check_tag.outputs.should_release == 'true'
        id: release_branch
        run: |
          BRANCH_NAME="release/${{ steps.version.outputs.RELEASE_TAG }}"
          git switch -c $BRANCH_NAME
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Commit and Conditionally Push package versions
        if: steps.check_tag.outputs.should_release == 'true'
        run: |
          if [[ "${{ steps.vars.outputs.is_dry_run }}" == "false" ]]; then
            echo "Pushing release branch to remote..."
            git push --set-upstream origin ${{ steps.release_branch.outputs.BRANCH_NAME }} --follow-tags
          else
            echo "Dry run enabled. Skipping push."
          fi

      - name: Create GitHub Release and Tag
        if: steps.check_tag.outputs.should_release == 'true' && steps.vars.outputs.is_dry_run == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release_branch.outputs.BRANCH_NAME }}
        run: |
          gh release create ${{ steps.version.outputs.RELEASE_TAG }} \
            --target "$RELEASE_BRANCH" \
            --title "Release ${{ steps.version.outputs.RELEASE_TAG }}" \
            --generate-notes

      - name: Create Issue on Failure
        if: failure()
        run: |
          gh issue create \
            --title "Release Failed for ${{ steps.version.outputs.RELEASE_TAG || 'N/A' }} on $(date +'%Y-%m-%d')" \
            --body "The release workflow failed. See the full run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "kind/bug,release-failure"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
